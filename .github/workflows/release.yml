name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $cargoPath = "src/frontend/src-tauri/Cargo.toml"
          $tauriPath = "src/frontend/src-tauri/tauri.conf.json"
          (Get-Content $cargoPath) -replace '^version\s*=\s*"[^"]*"', ('version = "' + $version + '"') | Set-Content $cargoPath
          (Get-Content $tauriPath) -replace '"version"\s*:\s*"[^"]*"', ('"version": "' + $version + '"') | Set-Content $tauriPath
          Write-Host "tag: $env:GITHUB_REF_NAME -> version: $version"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build release
        run: npm run desktop:build -- --bundles nsis
        working-directory: src/frontend

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          body: |
            ## ETS2 Mod Manager v${{ env.RELEASE_VERSION }}

            ### 更新内容
            - 启动时弹出更新窗口，展示本次更新说明与下载进度，支持忽略指定版本
            - 一键更新：下载完成后自动静默安装并重启应用，自动清理安装包
            - 汉化结果支持另存为：可保存为新文件并合并手动填写的本地化 key
            - 修复 base 城市/国家名读不到的问题（ETS2 1.53+ 拆分 locale.scs / def.scs）
            - 修复扫描进度卡在 N-1、条目路径显示临时目录的问题
            - 修复扫描时闪现黑色命令行窗口的问题