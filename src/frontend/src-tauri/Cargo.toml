[package]
name = "ets2-mod-manager"
version = "0.1.0"
description = "ETS2 Mod Manager desktop shell"
authors = ["ETS2ModManager"]
edition = "2021"

[lib]
name = "ets2_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
archive_core = { path = "../../core/rust/archive_core" }
bsii_core = { path = "../../core/rust/bsii_core" }
getrandom = "0.3"
zip = "2"
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
