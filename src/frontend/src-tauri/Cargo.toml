[package]
name = "ets2-mod-manager"
version = "0.1.0"
description = "ETS2 Mod Manager desktop shell"
authors = ["ETS2ModManager"]
edition = "2021"

[lib]
name = "ets2_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
